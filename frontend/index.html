<script type="module">
    import { ethers } from "https://esm.run/ethers@6.13.0";
    
    const CONFIG = { contractAddress: "0x472e230DfFA8c896b05A9a46c84BFb391756918e", chainId: 4441 };
    const ABI = [
        "function postMessage(string) external payable",
        "function postMessageWithToken(string) external payable",
        "function getMessageCount() view returns (uint256)",
        "function getMessage(uint256) view returns (address,string,uint256,uint256)",
        "function getMessagesByAddress(address,uint256,uint256) view returns (tuple(address sender, string text, uint256 timestamp, uint256 amount)[])",
        "function totalMessages() view returns (uint256)"
    ];
    
    let provider, signer, contract, currentOffset = 0, LIMIT = 10, isSearching = false, searchAddr = null;
    
    const els = {
        walletStatus: document.getElementById('walletStatus'), 
        connectBtn: document.getElementById('connectBtn'),
        switchNetworkBtn: document.getElementById('switchNetworkBtn'), 
        networkBadge: document.getElementById('networkBadge'),
        totalCount: document.getElementById('totalCount'), 
        totalTokens: document.getElementById('totalTokens'), 
        currentPage: document.getElementById('currentPage'),
        messageInput: document.getElementById('messageInput'), 
        tokenAmount: document.getElementById('tokenAmount'), 
        postBtn: document.getElementById('postBtn'),
        searchInput: document.getElementById('searchInput'), 
        searchBtn: document.getElementById('searchBtn'), 
        clearSearchBtn: document.getElementById('clearSearchBtn'),
        messagesList: document.getElementById('messagesList'), 
        pagination: document.getElementById('pagination'),
        prevBtn: document.getElementById('prevBtn'), 
        nextBtn: document.getElementById('nextBtn'), 
        pageInfo: document.getElementById('pageInfo'),
        charCount: document.getElementById('charCount'), 
        msgStatus: document.getElementById('msgStatus')
    };

    // ✅ FUNÇÃO DE SHARE DA DAPP - COM @LitecoinVM
    window.shareDApp = function() {
        const text = encodeURIComponent("@LitecoinVM Check out Guestbook LitVM - Leave your permanent message on the LitVM blockchain! 🚀");
        const url = encodeURIComponent(window.location.href);
        const hashtags = encodeURIComponent("LITVM,Litecoin,Guestbook");
        const shareUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}&hashtags=${hashtags}`;
        window.open(shareUrl, '_blank', 'width=550,height=420');
    };

    els.messageInput.addEventListener('input', () => els.charCount.textContent = els.messageInput.value.length);
    
    // ✅ CARREGAR MENSAGENS AO INICIAR (MODO LEITURA)
    window.addEventListener('load', async () => {
        els.messagesList.innerHTML = '<div class="loading">⏳ Carregando histórico...</div>';
        
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: "eth_accounts" });
                if (accounts.length > 0) {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    contract = new ethers.Contract(CONFIG.contractAddress, ABI, signer);
                    els.walletStatus.textContent = `✅ ${accounts[0].slice(0,6)}...${accounts[0].slice(-4)}`;
                    els.walletStatus.style.background = "#dcfce7"; 
                    els.walletStatus.style.color = "#166534";
                    els.messageInput.disabled = false; 
                    els.tokenAmount.disabled = false; 
                    els.postBtn.disabled = false;
                    els.searchInput.disabled = false; 
                    els.searchBtn.disabled = false;
                    els.connectBtn.classList.add('hidden');
                    await checkNetwork();
                } else {
                    await loadMessagesReadOnly();
                }
            } catch(e) {
                console.log("Auto-connect falhou, carregando modo leitura:", e);
                await loadMessagesReadOnly();
            }
        } else {
            await loadMessagesReadOnly();
        }
    });

    // ✅ FUNÇÃO PARA CARREGAR MENSAGENS SEM CONECTAR (SOMENTE LEITURA)
    async function loadMessagesReadOnly() {
        try {
            if (!window.ethereum) {
                els.messagesList.innerHTML = '<div class="error">⚠️ Instale MetaMask para interagir</div>';
                return;
            }
            
            provider = new ethers.BrowserProvider(window.ethereum);
            contract = new ethers.Contract(CONFIG.contractAddress, ABI, provider);
            
            els.messagesList.innerHTML = '<div class="loading">📜 Carregando mensagens públicas...</div>';
            await loadMessages();
        } catch(err) {
            console.error("Erro modo leitura:", err);
            els.messagesList.innerHTML = '<div class="error">⚠️ Conecte a wallet para ver as mensagens</div>';
        }
    }
    
    els.connectBtn.addEventListener('click', async () => {
        if (!window.ethereum) return alert("MetaMask not found!");
        try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONFIG.contractAddress, ABI, signer);
            els.walletStatus.textContent = `✅ ${accounts[0].slice(0,6)}...${accounts[0].slice(-4)}`;
            els.walletStatus.style.background = "#dcfce7"; 
            els.walletStatus.style.color = "#166534";
            els.messageInput.disabled = false; 
            els.tokenAmount.disabled = false; 
            els.postBtn.disabled = false;
            els.searchInput.disabled = false; 
            els.searchBtn.disabled = false;
            els.connectBtn.classList.add('hidden');
            await checkNetwork();
        } catch (e) { 
            if(e.code !== 4001) alert("Connection error: " + e.message); 
        }
    });

    async function checkNetwork() {
        try {
            const net = await provider.getNetwork();
            if (Number(net.chainId) !== CONFIG.chainId) {
                els.switchNetworkBtn.classList.remove('hidden');
                els.networkBadge.classList.add('hidden');
                els.networkBadge.classList.add('wrong');
            } else {
                els.switchNetworkBtn.classList.add('hidden');
                els.networkBadge.classList.remove('hidden');
                els.networkBadge.classList.remove('wrong');
                await loadStats(); 
                await loadMessages();
            }
        } catch(e) {
            console.error("Erro checkNetwork:", e);
        }
    }

    els.switchNetworkBtn.addEventListener('click', async () => {
        try { 
            await window.ethereum.request({ 
                method: 'wallet_switchEthereumChain', 
                params: [{ chainId: ethers.toBeHex(CONFIG.chainId) }] 
            }); 
        } catch (e) { 
            if(e.code === 4902) { 
                await window.ethereum.request({ 
                    method: 'wallet_addEthereumChain', 
                    params: [{ 
                        chainId: ethers.toBeHex(CONFIG.chainId), 
                        chainName: 'LitVM LiteForge', 
                        nativeCurrency: { 
                            name: 'zkLTC', 
                            symbol: 'zkLTC', 
                            decimals: 18 
                        }, 
                        rpcUrls: ['https://liteforge.rpc.caldera.xyz/http'], 
                        blockExplorerUrls: ['https://liteforge.explorer.caldera.xyz'] 
                    }] 
                }); 
            } 
        }
        setTimeout(checkNetwork, 1000);
    });

    els.postBtn.addEventListener('click', async () => {
        const txt = els.messageInput.value.trim(), 
              val = els.tokenAmount.value.trim();
        if (!txt) return showMsg("⚠️ Write something!", "error");
        els.postBtn.disabled = true; 
        showMsg("⏳ Sending...", "");
        try {
            const value = val ? ethers.parseEther(val) : 0n;
            const tx = value > 0n ? 
                await contract.postMessageWithToken(txt, { value }) : 
                await contract.postMessage(txt);
            showMsg("⏳ Confirming...", ""); 
            await tx.wait();
            showMsg("✅ Posted successfully!", "success");
            els.messageInput.value = ""; 
            els.tokenAmount.value = ""; 
            els.charCount.textContent = "0";
            await loadStats(); 
            await loadMessages();
        } catch(err) { 
            showMsg(err.code === 4001 ? "❌ Rejected" : `❌ ${err.shortMessage || err.message}`, "error"); 
        } finally { 
            els.postBtn.disabled = false; 
        }
    });

    async function loadStats() {
        try {
            const total = await contract.totalMessages();
            els.totalCount.textContent = Number(total).toLocaleString();
            const code = await provider.getCode(CONFIG.contractAddress);
            if(code === "0x") { 
                els.messagesList.innerHTML = "<div class='error'>❌ Contract not deployed</div>"; 
                return; 
            }
        } catch(e) {
            console.error("Erro loadStats:", e);
        }
    }

    async function loadMessages() {
        els.messagesList.innerHTML = '<div class="loading">⏳ Loading...</div>';
        let msgs = [];
        try {
            if (isSearching && searchAddr) {
                msgs = await contract.getMessagesByAddress(searchAddr, BigInt(LIMIT), BigInt(currentOffset));
            } else {
                const count = await contract.getMessageCount(), 
                      tot = Number(count);
                if (tot === 0) { 
                    els.messagesList.innerHTML = "<div class='empty-state'><h3>🎉 Be the first!</h3><p>No messages yet.</p></div>"; 
                    els.pagination.classList.add('hidden'); 
                    return; 
                }
                const start = Math.max(0, tot - currentOffset - LIMIT), 
                      end = tot - currentOffset;
                for (let i = end - 1; i >= start; i--) {
                    const [addr, text, ts, amt] = await contract.getMessage(i);
                    msgs.push({addr, text, timestamp: ts, amount: amt});
                }
            }
            if (msgs.length === 0) { 
                els.messagesList.innerHTML = "<div class='empty-state'>📭 No messages found</div>"; 
                els.pagination.classList.add('hidden'); 
                return; 
            }
            
            let html = "", totalVal = 0n;
            for (const m of msgs) {
                const d = new Date(Number(m.timestamp) * 1000).toLocaleString();
                const v = ethers.formatEther(m.amount || 0n); 
                totalVal += BigInt(m.amount || 0n);
                
                // ✅ CORREÇÃO: @LitecoinVM no início do share de cada mensagem
                const shareText = encodeURIComponent(`@LitecoinVM I just posted on LitVM Guestbook: "${m.text.substring(0, 100)}"`);
                const shareUrl = encodeURIComponent(window.location.href);
                const hashtags = encodeURIComponent("LITVM,Guestbook");
                const tweetUrl = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}&hashtags=${hashtags}`;
                
                const xIcon = `<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`;
                
                html += `<div class="message-card">
                    <div class="message-header">
                        <span class="message-sender">👤 ${m.addr.slice(0,6)}...${m.addr.slice(-4)}</span>
                        <span class="message-time">${d}</span>
                    </div>
                    <div class="message-text">${escapeHtml(m.text)}</div>
                    ${v > 0 ? `<div class="message-amount">💎 ${v} zkLTC</div>` : ''}
                    <a href="${tweetUrl}" target="_blank" class="btn-share-x">
                        ${xIcon} Compartilhar
                    </a>
                </div>`;
            }
            els.messagesList.innerHTML = html;
            els.totalTokens.textContent = ethers.formatEther(totalVal).substring(0,8) + " zkLTC";
            els.currentPage.textContent = Math.floor(currentOffset/LIMIT) + 1;
            els.pageInfo.textContent = `Page ${Math.floor(currentOffset/LIMIT) + 1}`;
            els.pagination.classList.remove('hidden');
            els.prevBtn.disabled = currentOffset === 0;
            els.nextBtn.disabled = isSearching ? msgs.length < LIMIT : currentOffset + LIMIT >= Number(await contract.getMessageCount());
        } catch(err) { 
            console.error("Load error:", err);
            els.messagesList.innerHTML = `<div class="error">❌ ${err.message || "Load failed"}. <button onclick="location.reload()" style="margin-left:10px;padding:5px 10px;">Recarregar</button></div>`; 
        }
    }

    els.searchBtn.addEventListener('click', async () => {
        const addr = els.searchInput.value.trim();
        if (!ethers.isAddress(addr)) return alert("Invalid address!");
        isSearching = true; 
        searchAddr = addr; 
        currentOffset = 0;
        els.clearSearchBtn.classList.remove('hidden');
        await loadMessages();
    });

    els.clearSearchBtn.addEventListener('click', () => {
        isSearching = false; 
        searchAddr = null; 
        currentOffset = 0;
        els.searchInput.value = ""; 
        els.clearSearchBtn.classList.add('hidden');
        loadMessages();
    });

    els.prevBtn.addEventListener('click', () => { 
        if(currentOffset >= LIMIT) { 
            currentOffset -= LIMIT; 
            loadMessages(); 
        } 
    });
    
    els.nextBtn.addEventListener('click', () => { 
        currentOffset += LIMIT; 
        loadMessages(); 
    });

    function showMsg(txt, type) { 
        els.msgStatus.className = type; 
        els.msgStatus.textContent = txt; 
        setTimeout(() => els.msgStatus.textContent = "", 4000); 
    }
    
    function escapeHtml(t) { 
        const d = document.createElement('div'); 
        d.textContent = t; 
        return d.innerHTML; 
    }
    
    if (window.ethereum) { 
        window.ethereum.on('accountsChanged', () => location.reload()); 
        window.ethereum.on('chainChanged', () => location.reload()); 
    }
</script>
