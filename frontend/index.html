<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitVM Guestbook | Official Mural</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #f0b90b; /* Cor característica Lit/Zk */
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border: #30363d;
            --success: #238636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .status-dot {
            height: 8px; width: 8px; border-radius: 50%;
            display: inline-block; margin-right: 5px;
        }
        .online { background: var(--success); box-shadow: 0 0 8px var(--success); }

        .avatar {
            width: 60px; height: 60px;
            background: var(--accent);
            color: #000;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.5rem; margin-bottom: 15px;
        }

        /* Main Content */
        .main-content { display: flex; flex-direction: column; gap: 20px; }

        .input-area {
            display: flex; flex-direction: column; gap: 12px;
        }

        textarea {
            width: 100%; height: 110px;
            background: #0d1117; border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; color: white;
            resize: none; outline: none; font-size: 1rem;
        }

        textarea:focus { border-color: var(--accent); }

        .btn {
            padding: 12px; border-radius: 8px; border: none;
            font-weight: 700; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-connect { background: var(--accent); color: #000; width: 100%; }
        .btn-post { background: var(--accent); color: #000; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Feed */
        .feed-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
            margin-bottom: 15px;
            animation: slideUp 0.4s ease-out;
        }

        .meta { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.8rem; }
        .addr { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
        .content { font-size: 1.05rem; line-height: 1.5; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="glass-card">
            <div class="avatar" id="userAvatar">L</div>
            <h3 id="walletStatus">Disconnected</h3>
            <p id="walletAddress" style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace; margin: 10px 0;">0x...None</p>
            <button class="btn btn-connect" id="connectBtn">Connect Wallet</button>
        </div>

        <div class="glass-card">
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                <span class="status-dot online"></span> <strong>LitVM Testnet</strong><br>
                Posts: <span id="postCount">0</span><br>
                Chain ID: 4441
            </p>
        </div>
    </aside>

    <main class="main-content">
        <div class="glass-card input-area">
            <h2 style="font-size: 1.2rem;">Leave a Message</h2>
            <textarea id="msgInput" placeholder="Write something on LitVM..."></textarea>
            <button class="btn btn-post" id="postBtn" disabled>Post Message</button>
        </div>

        <div id="feed">
            <!-- Messages load here -->
        </div>
    </main>
</div>

<!-- Web3 Integration -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const CONTRACT_ADDR = "0x89C5D0568019C84860737973059439603348126F";
    const RPC_URL = "https://rpc-testnet.litvm.com";
    
    const ABI = [
        "function getMessages(uint256 offset, uint256 limit) public view returns (tuple(address sender, string text, uint256 amount, uint256 timestamp)[])",
        "function postMessage(string text) public payable",
        "function getTotalMessages() public view returns (uint256)"
    ];

    let provider, contract;

    async function init() {
        // Carregamento inicial via RPC (mesmo sem carteira)
        provider = new ethers.JsonRpcProvider(RPC_URL);
        contract = new ethers.Contract(CONTRACT_ADDR, ABI, provider);
        
        loadFeed();

        if (window.ethereum) {
            const browserProvider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await browserProvider.listAccounts();
            if (accounts.length > 0) updateWalletUI(accounts[0].address);
        }
    }

    async function loadFeed() {
        try {
            const total = await contract.getTotalMessages();
            document.getElementById('postCount').innerText = total.toString();

            // Pega as últimas 20 mensagens
            const limit = 20n;
            const offset = total > limit ? total - limit : 0n;
            const messages = await contract.getMessages(offset, limit);

            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = [...messages].reverse().map(m => `
                <div class="feed-item">
                    <div class="meta">
                        <span class="addr">${m.sender.slice(0,6)}...${m.sender.slice(-4)}</span>
                        <span style="color: var(--text-muted)">${new Date(Number(m.timestamp)*1000).toLocaleDateString()}</span>
                    </div>
                    <div class="content">${m.text}</div>
                </div>
            `).join('');
        } catch (e) {
            console.error("Feed error:", e);
        }
    }

    async function connect() {
        if (!window.ethereum) return alert("Install MetaMask!");
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        updateWalletUI(accounts[0]);
    }

    function updateWalletUI(address) {
        document.getElementById('walletAddress').innerText = address;
        document.getElementById('walletStatus').innerText = "Connected";
        document.getElementById('userAvatar').innerText = address.substring(2,4).toUpperCase();
        document.getElementById('connectBtn').style.display = "none";
        document.getElementById('postBtn').disabled = false;
    }

    document.getElementById('postBtn').onclick = async () => {
        const text = document.getElementById('msgInput').value;
        if (!text) return;

        try {
            const browserProvider = new ethers.BrowserProvider(window.ethereum);
            const signer = await browserProvider.getSigner();
            const contractWithSigner = new ethers.Contract(CONTRACT_ADDR, ABI, signer);

            document.getElementById('postBtn').innerText = "Wait...";
            const tx = await contractWithSigner.postMessage(text);
            await tx.wait();

            document.getElementById('msgInput').value = "";
            loadFeed();
        } catch (e) {
            alert("Error sending to LitVM. Check your network.");
        } finally {
            document.getElementById('postBtn').innerText = "Post Message";
        }
    };

    document.getElementById('connectBtn').onclick = connect;
    window.onload = init;
</script>
</body>
</html>
