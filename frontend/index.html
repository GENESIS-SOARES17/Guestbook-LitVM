<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guestbook LitVM • Social Web3 Guestbook</title>

<style>
/* =========================================================
    🌐 ORKUT STYLE WEB3 SOCIAL UI — LITVM EDITION
========================================================= */

:root{
    --blue-main:#6B8DD6;
    --blue-soft:#8FA8E8;
    --blue-light:#dfe9ff;
    --bg:#F3F4F6;
    --card:#ffffff;
    --border:#c9d8f5;
    --text:#374151;
    --muted:#6b7280;
    --hover:#5f7ec7;
    --shadow:0 2px 8px rgba(0,0,0,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:Arial, Verdana, sans-serif;
    color:var(--text);
    overflow-x:hidden;
}

/* =========================================================
    HEADER
========================================================= */

.top-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:999;
    background:linear-gradient(to bottom,#8FA8E8,#6B8DD6);
    border-bottom:1px solid #5e7fcb;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px;
    flex-wrap:wrap;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:280px;
}

.logo img{
    width:124px; 
    height:124px; 
    object-fit:contain;
}

.logo h1{
    color:white;
    font-size:30px;
    letter-spacing:.5px;
    text-shadow:1px 1px 0 rgba(0,0,0,.15);
}

/* =========================================================
    TICKER
========================================================= */

.ticker-wrap{
    flex:1;
    min-width:300px;
    overflow:hidden;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.3);
    border-radius:12px;
    height:58px;
    display:flex;
    align-items:center;
}

.ticker{
    white-space:nowrap;
    animation:ticker 40s linear infinite;
    color:white;
    font-weight:bold;
    font-size:15px;
}

.ticker span{
    display:inline-block;
    padding:0 40px;
}

@keyframes ticker{
    from{transform:translateX(100%)}
    to{transform:translateX(-100%)}
}

/* =========================================================
    MAIN LAYOUT
========================================================= */

.main{
    max-width:1400px;
    margin:180px auto 40px auto;
    padding:0 16px;
    display:grid;
    grid-template-columns:260px minmax(0,1fr) 260px;
    gap:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.card-header{
    background:linear-gradient(to bottom,#8FA8E8,#6B8DD6);
    color:white;
    font-weight:bold;
    padding:12px 16px;
    font-size:16px;
}

.card-body{
    padding:18px;
}

/* =========================================================
    INTERFACES
========================================================= */

button{
    background:white;
    color:var(--blue-main);
    border:1px solid white;
    padding:10px 20px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
    transition: 0.2s;
}

button:hover{
    background:var(--blue-light);
}

.btn-post{
    background:var(--blue-main);
    color:white;
    width:100%;
    margin-top:10px;
}

.hidden { display: none; }

#walletAddress {
    font-size: 11px;
    word-break: break-all;
    background: #f0f4ff;
    padding: 8px;
    border-radius: 8px;
    margin-top: 10px;
}

</style>
</head>
<body>

<header class="top-header">
    <div class="header-inner">
        <div class="logo">
            <img src="./LITVM 2.png" alt="LitVM Logo">
            <h1>Guestbook LitVM</h1>
        </div>
        <div class="ticker-wrap">
            <div class="ticker">
                <span>🚀 Live on LitVM blockchain</span>
                <span>⚡ zkLTC social interactions powered by decentralized infrastructure</span>
                <span>💬 Share permanent memories directly on-chain forever</span>
            </div>
        </div>
        <button id="connectBtn">Connect Wallet</button>
    </div>
</header>

<div class="main">
    <!-- LEFT -->
    <aside>
        <div class="card">
            <div class="card-header">👤 Profile</div>
            <div class="card-body" style="text-align:center;">
                <div style="width:80px; height:80px; background:#dfe9ff; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px;">👤</div>
                <div id="walletAddress">Disconnected</div>
            </div>
        </div>
    </aside>

    <!-- CENTER -->
    <main>
        <div class="card">
            <div class="card-header">💬 Post a Message</div>
            <div class="card-body">
                <textarea id="messageInput" style="width:100%; height:100px; border:1px solid var(--border); border-radius:12px; padding:10px; resize:none;" placeholder="Write something on the blockchain..."></textarea>
                <button id="postBtn" class="btn-post">Post Message</button>
            </div>
        </div>

        <div id="feedArea">
            <div class="card">
                <div class="card-body" style="text-align:center; color:var(--muted);">
                    Connect your wallet to see the messages.
                </div>
            </div>
        </div>
    </main>

    <!-- RIGHT -->
    <aside>
        <div class="card">
            <div class="card-header">📊 Stats</div>
            <div class="card-body">
                <p style="font-size:13px;">Network: LitVM</p>
                <p style="font-size:13px;">Status: Online</p>
            </div>
        </div>
    </aside>
</div>

<!-- CORREÇÃO DA CONEXÃO DA CARTEIRA -->
<script type="module">
    // Importando a versão estável da ethers.js via CDN (ESM)
    import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

    const connectBtn = document.getElementById('connectBtn');
    const walletAddress = document.getElementById('walletAddress');

    async function connectWallet() {
        if (window.ethereum) {
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                const address = accounts[0];
                
                walletAddress.innerText = address;
                connectBtn.innerText = "Connected";
                console.log("Connected to:", address);
            } catch (error) {
                console.error("User denied account access", error);
                alert("Connection failed!");
            }
        } else {
            alert("Please install MetaMask!");
        }
    }

    connectBtn.addEventListener('click', connectWallet);

    // Listener para troca de conta
    if (window.ethereum) {
        window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length > 0) {
                walletAddress.innerText = accounts[0];
            } else {
                walletAddress.innerText = "Disconnected";
                connectBtn.innerText = "Connect Wallet";
            }
        });
    }
</script>

</body>
</html>
