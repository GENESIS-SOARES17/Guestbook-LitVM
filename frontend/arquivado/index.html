<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook LitVM - Decentralized Guestbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .wallet-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .address-display {
            background: #f0f0f0;
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .network-badge {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .network-badge.wrong {
            background: #ef4444;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .char-counter {
            text-align: right;
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-section input {
            flex: 1;
        }

        .messages-list {
            display: grid;
            gap: 20px;
        }

        .message-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-sender {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
        }

        .message-time {
            font-size: 14px;
            color: #888;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        .message-amount {
            display: inline-block;
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .page-info {
            font-size: 16px;
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 18px;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        footer {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer-link:hover {
            color: #764ba2;
            transform: translateY(-2px);
        }

        .footer-icon {
            width: 24px;
            height: 24px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .wallet-section {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .search-section {
                flex-direction: column;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Guestbook LitVM</h1>
            <p class="subtitle">Leave your mark on the LitVM blockchain</p>
        </header>

        <div class="card">
            <div class="wallet-section">
                <div class="wallet-info">
                    <button id="connectBtn">Connect Wallet</button>
                    <div id="walletAddress" class="address-display hidden"></div>
                    <div id="networkBadge" class="network-badge hidden"></div>
                </div>
                <button id="switchNetworkBtn" class="btn-secondary hidden">Switch to LitVM</button>
            </div>
        </div>

        <div id="statsSection" class="hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="totalMessages">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Viewing Range</div>
                    <div class="stat-value" id="viewingRange">0-0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total zkLTC Sent</div>
                    <div class="stat-value" id="totalTokens">0</div>
                </div>
            </div>
        </div>

        <div id="postSection" class="card hidden">
            <h2>✍️ Post a Message</h2>
            <div id="messageStatus"></div>
            <form id="messageForm">
                <div class="form-group">
                    <label for="messageText">Your Message</label>
                    <textarea id="messageText" placeholder="Share your thoughts..." maxlength="280" required></textarea>
                    <div class="char-counter"><span id="charCount">0</span>/280</div>
                </div>
                <div class="form-group">
                    <label for="tokenAmount">zkLTC Amount (Optional)</label>
                    <input type="number" id="tokenAmount" placeholder="0.0" step="0.001" min="0">
                </div>
                <button type="submit" id="submitBtn">Send Message</button>
            </form>
        </div>

        <div id="messagesSection" class="card hidden">
            <h2>💬 Recent Messages</h2>
            <div class="search-section">
                <input type="text" id="searchAddress" placeholder="Search by wallet address (0x...)">
                <button id="searchBtn" class="btn-success">Search</button>
                <button id="clearSearchBtn" class="btn-secondary">Clear</button>
            </div>
            <div id="messagesContainer">
                <div class="loading">Loading messages...</div>
            </div>
            <div class="pagination hidden" id="paginationControls">
                <button id="prevBtn">← Previous</button>
                <span class="page-info" id="pageInfo">Page 1</span>
                <button id="nextBtn">Next →</button>
            </div>
        </div>

        <footer>
            <div class="footer-content">
                <div class="footer-title">Developed with ❤️ on LitVM</div>
                <div class="footer-links">
                    <a href="https://x.com/EDSOSI" target="_blank" class="footer-link">
                        <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                        @EDSOSI
                    </a>
                    <a href="mailto:edgardsilvasoares@gmail.com" class="footer-link">
                        <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        Email

                    <a href="https://discord.com/users/1genesis17" target="_blank" class="footer-link">
                        <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">

    <script type="module">
        import { ethers } from "https://esm.run/ethers@6.13.0";

        // Configuration
        const LITVM_CONFIG = {
            chainId: '0x1159', // 4441 in hex
            chainName: 'LitVM LiteForge Testnet',
            nativeCurrency: {
                name: 'zkLTC',
                symbol: 'zkLTC',
                decimals: 18
            },
            rpcUrls: ['https://liteforge.rpc.caldera.xyz/http'],
            blockExplorerUrls: ['https://liteforge.explorer.caldera.xyz']
        };

        const MESSAGES_PER_PAGE = 10;

        // State
        let provider = null;
        let signer = null;
        let contract = null;
        let userAddress = null;
        let currentPage = 0;
        let isSearchMode = false;
        let searchAddress = null;
        let contractConfig = null;

        // DOM Elements
        const connectBtn = document.getElementById('connectBtn');
        const walletAddress = document.getElementById('walletAddress');
        const networkBadge = document.getElementById('networkBadge');
        const switchNetworkBtn = document.getElementById('switchNetworkBtn');
        const statsSection = document.getElementById('statsSection');
        const postSection = document.getElementById('postSection');
        const messagesSection = document.getElementById('messagesSection');
        const messageForm = document.getElementById('messageForm');
        const messageText = document.getElementById('messageText');
        const tokenAmount = document.getElementById('tokenAmount');
        const charCount = document.getElementById('charCount');
        const messageStatus = document.getElementById('messageStatus');
        const messagesContainer = document.getElementById('messagesContainer');
        const paginationControls = document.getElementById('paginationControls');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const searchAddressInput = document.getElementById('searchAddress');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        // Load contract configuration
        async function loadConfig() {
            try {
                const response = await fetch('./config.json');
                contractConfig = await response.json();
                console.log('Contract config loaded:', contractConfig);
            } catch (error) {
                console.error('Failed to load config:', error);
                showError('Failed to load contract configuration. Please ensure the contract is deployed.');
            }
        }

        // Initialize
        async function init() {
            await loadConfig();
            
            if (!contractConfig) {
                showError('Contract configuration not found. Please deploy the contract first.');
                return;
            }

            connectBtn.addEventListener('click', connectWallet);
            switchNetworkBtn.addEventListener('click', switchNetwork);
            messageForm.addEventListener('submit', handleSubmit);
            messageText.addEventListener('input', updateCharCount);
            prevBtn.addEventListener('click', () => changePage(-1));
            nextBtn.addEventListener('click', () => changePage(1));
            searchBtn.addEventListener('click', handleSearch);
            clearSearchBtn.addEventListener('click', clearSearch);

            if (window.ethereum) {
                window.ethereum.on('accountsChanged', handleAccountsChanged);
                window.ethereum.on('chainChanged', () => window.location.reload());
            }
        }

        // Connect Wallet
        async function connectWallet() {
            if (!window.ethereum) {
                showError('MetaMask is not installed. Please install MetaMask to use this dApp.');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                await setupProvider();
                await checkNetwork();
            } catch (error) {
                console.error('Connection error:', error);
                showError('Failed to connect wallet: ' + error.message);
            }
        }

        // Setup Provider
        async function setupProvider() {
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            contract = new ethers.Contract(
                contractConfig.contractAddress,
                contractConfig.abi,
                signer
            );

            walletAddress.textContent = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
            walletAddress.classList.remove('hidden');
            connectBtn.textContent = 'Connected';
            connectBtn.disabled = true;

            await loadStats();
            await loadMessages();
        }

        // Check Network
        async function checkNetwork() {
            const network = await provider.getNetwork();
            const chainId = '0x' + network.chainId.toString(16);

            if (chainId === LITVM_CONFIG.chainId) {
                networkBadge.textContent = '✓ LitVM Network';
                networkBadge.classList.remove('wrong');
                networkBadge.classList.remove('hidden');
                switchNetworkBtn.classList.add('hidden');
                statsSection.classList.remove('hidden');
                postSection.classList.remove('hidden');
                messagesSection.classList.remove('hidden');
            } else {
                networkBadge.textContent = '✗ Wrong Network';
                networkBadge.classList.add('wrong');
                networkBadge.classList.remove('hidden');
                switchNetworkBtn.classList.remove('hidden');
                statsSection.classList.add('hidden');
                postSection.classList.add('hidden');
                messagesSection.classList.add('hidden');
            }
        }

        // Switch Network
        async function switchNetwork() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: LITVM_CONFIG.chainId }],
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [LITVM_CONFIG],
                        });
                    } catch (addError) {
                        showError('Failed to add LitVM network: ' + addError.message);
                    }
                } else {
                    showError('Failed to switch network: ' + switchError.message);
                }
            }
        }

        // Load Stats
        async function loadStats() {
            try {
                const totalMessages = await contract.getMessageCount();
                const totalTokens = await contract.getTotalTokens();

                document.getElementById('totalMessages').textContent = totalMessages.toString();
                document.getElementById('totalTokens').textContent = 
                    parseFloat(ethers.formatEther(totalTokens)).toFixed(4) + ' zkLTC';

                updateViewingRange();
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Update Viewing Range
        function updateViewingRange() {
            const totalMessages = parseInt(document.getElementById('totalMessages').textContent);
            if (totalMessages === 0) {
                document.getElementById('viewingRange').textContent = '0-0';
                return;
            }

            const start = Math.max(0, totalMessages - (currentPage + 1) * MESSAGES_PER_PAGE);
            const end = Math.max(0, totalMessages - currentPage * MESSAGES_PER_PAGE);
            document.getElementById('viewingRange').textContent = `${start + 1}-${end}`;
        }

        // Load Messages
        async function loadMessages() {
            try {
                messagesContainer.innerHTML = '<div class="loading">Loading messages...</div>';

                let messages;
                if (isSearchMode && searchAddress) {
                    messages = await contract.getMessagesByAddress(
                        searchAddress,
                        MESSAGES_PER_PAGE,
                        currentPage * MESSAGES_PER_PAGE
                    );
                } else {
                    messages = await contract.getRecentMessages(
                        MESSAGES_PER_PAGE,
                        currentPage * MESSAGES_PER_PAGE
                    );
                }

                if (messages.length === 0) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <h3>No messages found</h3>
                            <p>${isSearchMode ? 'Try a different address' : 'Be the first to leave a message!'}</p>
                        </div>
                    `;
                    paginationControls.classList.add('hidden');
                    return;
                }

                messagesContainer.innerHTML = messages.map(msg => `
                    <div class="message-card">
                        <div class="message-header">
                            <span class="message-sender">${msg.sender}</span>
                            <span class="message-time">${formatDate(Number(msg.timestamp))}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        ${msg.amount > 0 ? `<span class="message-amount">💎 ${ethers.formatEther(msg.amount)} zkLTC</span>` : ''}
                    </div>
                `).join('');

                paginationControls.classList.remove('hidden');
                updatePaginationButtons();
                updateViewingRange();
            } catch (error) {
                console.error('Failed to load messages:', error);
                messagesContainer.innerHTML = '<div class="error">Failed to load messages. Please try again.</div>';
            }
        }

        // Update Pagination Buttons
        function updatePaginationButtons() {
            const totalMessages = parseInt(document.getElementById('totalMessages').textContent);
            const maxPage = Math.ceil(totalMessages / MESSAGES_PER_PAGE) - 1;

            prevBtn.disabled = currentPage >= maxPage;
            nextBtn.disabled = currentPage === 0;
            pageInfo.textContent = `Page ${currentPage + 1}`;
        }

        // Change Page
        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 0) currentPage = 0;
            loadMessages();
        }

        // Handle Search
        async function handleSearch() {
            const address = searchAddressInput.value.trim();
            if (!address) {
                showError('Please enter a wallet address');
                return;
            }

            if (!ethers.isAddress(address)) {
                showError('Invalid wallet address');
                return;
            }

            isSearchMode = true;
            searchAddress = address;
            currentPage = 0;
            await loadMessages();
        }

        // Clear Search
        function clearSearch() {
            isSearchMode = false;
            searchAddress = null;
            searchAddressInput.value = '';
            currentPage = 0;
            loadMessages();
        }

        // Handle Form Submit
        async function handleSubmit(e) {
            e.preventDefault();

            const text = messageText.value.trim();
            const amount = tokenAmount.value || '0';

            if (!text) {
                showError('Please enter a message');
                return;
            }

            try {
                messageStatus.innerHTML = '<div class="loading">Sending message...</div>';
                document.getElementById('submitBtn').disabled = true;

                let tx;
                const value = ethers.parseEther(amount);

                if (value > 0) {
                    tx = await contract.postMessageWithToken(text, { value });
                } else {
                    tx = await contract.postMessage(text, { value: 0 });
                }

                messageStatus.innerHTML = '<div class="loading">Waiting for confirmation...</div>';
                await tx.wait();

                showSuccess('Message posted successfully!');
                messageForm.reset();
                charCount.textContent = '0';
                
                await loadStats();
                currentPage = 0;
                await loadMessages();
            } catch (error) {
                console.error('Transaction error:', error);
                showError('Failed to post message: ' + (error.reason || error.message));
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        // Update Character Count
        function updateCharCount() {
            charCount.textContent = messageText.value.length;
        }

        // Handle Accounts Changed
        function handleAccountsChanged(accounts) {
            if (accounts.length === 0) {
                window.location.reload();
            } else {
                window.location.reload();
            }
        }

        // Utility Functions
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            messageStatus.innerHTML = `<div class="error">❌ ${message}</div>`;
            setTimeout(() => messageStatus.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            messageStatus.innerHTML = `<div class="success">✅ ${message}</div>`;
            setTimeout(() => messageStatus.innerHTML = '', 5000);
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
